<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #f56db5;
            --secundary-color: #e20000;
            --terciary-color: #FFFFFF;
        }

        .roboto {
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }

        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            background-color: var(--terciary-color);
        }

        .rojo {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            background-color: var(--secundary-color);
            color: var(--terciary-color);
        }

        #centro {
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        #rosa {
            flex: 1;
            background-color: var(--primary-color);
        }

        #blanco {
            flex: 1;
            background-color: var(--terciary-color);
        }

        h1 {
            font-size: 96px;
            font-weight: normal;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rojo roboto">
            <h1>blanco</h1>
        </div>
        <div id="centro">
            <div id="rosa"></div>
            <div id="blanco"></div>
        </div>
        <div class="rojo roboto">
            <h1>rojo</h1>
            <a href="https://www.figma.com/design/4EJVsCAhzNEOUMCfEmiJsF/Untitled?node-id=0-1&t=UG1ajvikuUcQfsO0-1">FIGMA</a>
        </div> 
    </div>
</body>
</html
